name: release
on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-release:
    permissions:
      contents: write  # upload release assets
    name: build-release
    runs-on: ubuntu-22.04
    env:
      RUST_BACKTRACE: 1

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-musl

    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

    - name: Build release binaries
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Create archives
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        TARGET="x86_64-unknown-linux-musl"
        # Keep in sync with workspace members in Cargo.toml (minus the "common" lib crate).
        BINARIES=(
          chronic combine errno ifdata ifne isutf8
          lckdo mispipe parallel pee sponge ts
          vidir vipe zrun
        )
        for bin in "${BINARIES[@]}"; do
          staging="${bin}-${VERSION}-${TARGET}"
          mkdir "$staging"
          cp "target/${TARGET}/release/${bin}" "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
        done

    - name: Publish release assets
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        tag_name: ${{ github.ref_name }}
        files: "*.tar.gz"
        fail_on_unmatched_files: true
