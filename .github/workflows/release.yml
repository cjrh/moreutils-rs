name: release
on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-release:
    permissions:
      contents: write  # upload release assets
    name: build-release
    runs-on: ubuntu-22.04
    env:
      RUST_BACKTRACE: 1

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-musl

    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

    - name: Build release binaries
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Create archives
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        TARGET="x86_64-unknown-linux-musl"
        # Keep in sync with workspace members in Cargo.toml (minus the "common" lib crate).
        BINARIES=(
          chronic combine errno ifdata ifne isutf8
          lckdo mispipe parallel pee sponge ts
          vidir vipe zrun
        )
        for bin in "${BINARIES[@]}"; do
          staging="${bin}-${VERSION}-${TARGET}"
          mkdir "$staging"
          cp "target/${TARGET}/release/${bin}" "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
        done

    - name: Publish release assets
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ github.ref_name }}
        files: "*.tar.gz"
        fail_on_unmatched_files: true
