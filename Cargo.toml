[workspace]
members = [
    "crates/common",
    "crates/combine",
    "crates/sponge",
    "crates/ifne",
    "crates/chronic",
    "crates/mispipe",
    "crates/pee",
    "crates/isutf8",
    "crates/zrun",
    "crates/parallel",
    "crates/ts",
    "crates/errno",
    "crates/ifdata",
    "crates/lckdo",
    "crates/vipe",
    "crates/vidir",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cjrh/moreutils-rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 'z'
strip = "symbols"

[workspace.metadata.release]
# Bare semver tag (e.g. `0.2.0`, no `v` prefix) so the release workflow fires.
tag-name = "{{version}}"
# Not a library — don't push to crates.io.
publish = false
# Single commit + single tag for the whole workspace.
consolidate-commits = true

[workspace.dependencies]
moreutils-common = { path = "crates/common" }
libc = "0.2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nix = { version = "0.30", features = ["net", "socket"] }
