[workspace]
members = [
    "crates/common",
    "crates/combine",
    "crates/sponge",
    "crates/ifne",
    "crates/chronic",
    "crates/mispipe",
    "crates/pee",
    "crates/isutf8",
    "crates/zrun",
    "crates/parallel",
    "crates/ts",
    "crates/errno",
    "crates/ifdata",
    "crates/lckdo",
    "crates/vipe",
    "crates/vidir",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/cjrh/moreutils-rs"
description = "Rust implementations of the moreutils tools"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 'z'
strip = "symbols"

[workspace.metadata.release]
# Bare semver tag (e.g. `0.2.0`, no `v` prefix) so the release workflow fires.
tag-name = "{{version}}"
# Publish to crates.io manually: common lib first, then binaries.
publish = true
# Single commit + single tag for the whole workspace.
consolidate-commits = true

[workspace.dependencies]
cjrh-moreutils-common = { path = "crates/common", version = "0.1.4" }
libc = "0.2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nix = { version = "0.31", features = ["net", "socket", "fs", "signal"] }
